<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <!-- GetYourWebsite mark: a pointy-top hexagon holding two overlapping pages.
       One flat fill. Inlined on the site (Wordmark.astro) the hexagon takes
       currentColor and the pages take the mark-page custom property; this
       standalone file is the indigo-on-white default. No double hyphens in
       this comment: they are illegal in XML and break the file as a favicon. -->
  <path d="M32 2 L58 17 L58 47 L32 62 L6 47 L6 17 Z" fill="#2f3dd6"/>
  <rect x="18" y="18" width="18" height="18" fill="#ffffff"/>
  <rect x="28" y="28" width="18" height="18" fill="#ffffff"/>
</svg>
